<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PriceMyService</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

      color: #111;

    }

    .container {

      max-width: 600px;

      margin: auto;

      padding: 30px 20px;

    }

    .logo {

      text-align: center;

      font-size: 28px;

      font-weight: bold;

      margin-bottom: 10px;

    }

    .subtitle {

      text-align: center;

      color: #666;

      margin-bottom: 30px;

    }

    .card {

      background: white;

      padding: 25px;

      border-radius: 18px;

      box-shadow: 0 5px 20px rgba(0,0,0,0.08);

    }

    label {

      display: block;

      font-weight: bold;

      margin-top: 15px;

      margin-bottom: 7px;

    }

    input,

    select {

      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

    }

    button {

      width: 100%;

      padding: 15px;

      margin-top: 20px;

      border: none;

      border-radius: 10px;

      background: #111;

      color: white;

      font-size: 17px;

      font-weight: bold;

    }

    .result {

      display: none;

      margin-top: 20px;

      padding: 20px;

      background: #111;

      color: white;

      border-radius: 15px;

      text-align: center;

    }

    .price {

      font-size: 42px;

      font-weight: bold;

      margin: 10px 0;

    }

    .details {

      margin-top: 15px;

      text-align: left;

      line-height: 1.8;

      color: #ddd;

    }

    footer {

      text-align: center;

      margin-top: 30px;

      color: #777;

      font-size: 13px;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo">PriceMyService</div>

    <div class="subtitle">

      Calculate the right price for your service.

    </div>

    <div class="card">

      <label>Service Name</label>

      <input id="service" type="text" placeholder="Example: Hair Coloring">

      <label>Hours Worked</label>

      <input id="hours" type="number" placeholder="2">

      <label>Hourly Rate ($)</label>

      <input id="rate" type="number" placeholder="15">

      <label>Material Cost ($)</label>

      <input id="materials" type="number" placeholder="10">

      <label>Profit Margin</label>

      <select id="margin">

        <option value="20">20%</option>

        <option value="30" selected>30%</option>

        <option value="40">40%</option>

        <option value="50">50%</option>

        <option value="60">60%</option>

      </select>

      <button onclick="calculatePrice()">

        Calculate My Price

      </button>

      <div id="result" class="result">

        <div>Recommended Price</div>

        <div id="price" class="price">

          $0.00

        </div>

        <div class="details">

          Labor: $<span id="labor">0.00</span><br>

          Materials: $<span id="materialResult">0.00</span><br>

          Profit: $<span id="profit">0.00</span>

        </div>

      </div>

    </div>

    <footer>

      PriceMyService © 2026

    </footer>

  </div>

<script>

function calculatePrice() {

  const hours =

    Number(document.getElementById("hours").value) || 0;

  const rate =

    Number(document.getElementById("rate").value) || 0;

  const materials =

    Number(document.getElementById("materials").value) || 0;

  const margin =

    Number(document.getElementById("margin").value) / 100;

  const labor = hours * rate;

  const baseCost = labor + materials;

  const finalPrice = baseCost / (1 - margin);

  const profit = finalPrice - baseCost;

  document.getElementById("price").innerText =

    "$" + finalPrice.toFixed(2);

  document.getElementById("labor").innerText =

    labor.toFixed(2);

  document.getElementById("materialResult").innerText =

    materials.toFixed(2);

  document.getElementById("profit").innerText =

    profit.toFixed(2);

  document.getElementById("result").style.display =

    "block";

}

</script>

</body>

</html>
